<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>성경암송 연습 🌟</title>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #4FC3F7;
    --blue: #1976D2;
    --deep: #0D47A1;
    --light: #E3F2FD;
    --mint: #80DEEA;
    --yellow: #FFF59D;
    --pink: #F8BBD9;
    --white: #FAFEFF;
    --correct: #66BB6A;
    --wrong: #EF5350;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Gaegu', cursive;
    background: linear-gradient(135deg, #E3F2FD 0%, #B3E5FC 40%, #E0F7FA 100%);
    min-height: 100vh;
    padding: 20px;
    overflow-x: hidden;
  }

  /* 구름 배경 */
  body::before {
    content: '';
    position: fixed;
    top: -50px; left: -50px;
    width: 200px; height: 120px;
    background: white;
    border-radius: 60px;
    opacity: 0.4;
    box-shadow: 250px 80px 0 white, 500px 20px 0 white, 700px 60px 0 white,
                150px 300px 0 white, 450px 250px 0 white, 650px 320px 0 white;
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 800px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* 헤더 */
  .header {
    text-align: center;
    margin-bottom: 24px;
    animation: floatDown 0.8s ease;
  }

  @keyframes floatDown {
    from { opacity: 0; transform: translateY(-30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .header h1 {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 48px;
    color: var(--deep);
    text-shadow: 3px 3px 0 var(--mint), 5px 5px 0 rgba(79,195,247,0.3);
    line-height: 1.2;
  }

  .header .subtitle2 {
    font-size: 20px;
    color: var(--sky);
    margin-top: 2px;
    font-family: 'Nanum Pen Script', cursive;
    letter-spacing: 2px;
  }

  .header .subtitle {
    font-size: 22px;
    color: var(--blue);
    margin-top: 4px;
  }

  .header .subtitle2 {
    font-size: 20px;
    color: var(--deep);
    font-family: 'Nanum Pen Script', cursive;
    margin-top: 2px;
    letter-spacing: 2px;
  }

  .stars {
    font-size: 28px;
    letter-spacing: 6px;
    display: block;
    margin-top: 4px;
  }

  /* 점수판 */
  .scoreboard {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .score-card {
    background: white;
    border: 3px solid var(--sky);
    border-radius: 20px;
    padding: 10px 22px;
    text-align: center;
    box-shadow: 0 4px 0 var(--sky);
    min-width: 110px;
  }

  .score-card .label {
    font-size: 16px;
    color: var(--blue);
  }

  .score-card .value {
    font-size: 32px;
    color: var(--deep);
    font-weight: 700;
  }

  /* 탭 메뉴 */
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }

  .tab-btn {
    font-family: 'Gaegu', cursive;
    font-size: 18px;
    padding: 10px 18px;
    border: 3px solid var(--blue);
    border-radius: 30px;
    background: white;
    color: var(--blue);
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
  }

  .tab-btn.active {
    background: var(--blue);
    color: white;
    box-shadow: 0 4px 0 var(--deep);
    transform: translateY(-2px);
  }

  /* 구절 선택 */
  .verse-selector {
    background: white;
    border: 3px solid var(--sky);
    border-radius: 24px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 6px 0 var(--sky);
  }

  .verse-selector h2 {
    font-size: 24px;
    color: var(--deep);
    margin-bottom: 14px;
    text-align: center;
  }

  .verse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }

  .verse-item {
    background: var(--light);
    border: 2px solid var(--sky);
    border-radius: 14px;
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
    font-family: 'Gaegu', cursive;
    font-size: 17px;
    color: var(--deep);
    text-align: left;
    line-height: 1.4;
  }

  .verse-item:active { transform: scale(0.97); }

  .verse-item.selected {
    background: var(--blue);
    color: white;
    border-color: var(--deep);
    box-shadow: 0 4px 0 var(--deep);
  }

  .verse-item .ref {
    font-size: 14px;
    opacity: 0.75;
    display: block;
  }

  /* 메인 카드 */
  .main-card {
    background: white;
    border: 3px solid var(--sky);
    border-radius: 28px;
    padding: 28px;
    margin-bottom: 20px;
    box-shadow: 0 8px 0 var(--sky);
    animation: popIn 0.4s ease;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 8px;
  }

  .topic-badge {
    background: var(--blue);
    color: white;
    border-radius: 30px;
    padding: 6px 18px;
    font-size: 18px;
  }

  .ref-badge {
    background: var(--yellow);
    border: 2px solid #F9A825;
    border-radius: 30px;
    padding: 6px 18px;
    font-size: 18px;
    color: #5D4037;
  }

  /* 구절 텍스트 */
  .verse-text {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 30px;
    line-height: 1.8;
    color: #1A237E;
    margin-bottom: 20px;
    word-break: keep-all;
    background: linear-gradient(135deg, #F0F9FF, #E8F5FF);
    border-radius: 16px;
    padding: 18px 20px;
    border-left: 5px solid var(--sky);
  }

  /* 빈칸 */
  .blank {
    display: inline-block;
    border-bottom: 3px solid var(--blue);
    min-width: 80px;
    margin: 0 3px;
    vertical-align: bottom;
    position: relative;
  }

  .blank-input {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 28px;
    color: var(--blue);
    border: none;
    outline: none;
    background: transparent;
    width: 100%;
    min-width: 60px;
    text-align: center;
    -webkit-appearance: none;
  }

  .blank.correct { border-color: var(--correct); }
  .blank.wrong { border-color: var(--wrong); }
  .blank.correct .blank-input { color: var(--correct); }
  .blank.wrong .blank-input { color: var(--wrong); }

  /* 선택지 버튼 */
  .choices {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
    justify-content: center;
  }

  .choice-btn {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 26px;
    padding: 8px 22px;
    background: var(--light);
    border: 2.5px solid var(--sky);
    border-radius: 40px;
    color: var(--deep);
    cursor: pointer;
    transition: all 0.18s;
    -webkit-appearance: none;
    box-shadow: 0 3px 0 var(--sky);
  }

  .choice-btn:active { transform: translateY(2px); box-shadow: none; }
  .choice-btn.used { opacity: 0.35; pointer-events: none; }
  .choice-btn.correct-choice { background: #C8E6C9; border-color: var(--correct); box-shadow: 0 3px 0 var(--correct); }
  .choice-btn.wrong-choice { background: #FFCDD2; border-color: var(--wrong); box-shadow: 0 3px 0 var(--wrong); }

  /* 버튼 영역 */
  .btn-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
    margin-top: 18px;
  }

  .btn {
    font-family: 'Gaegu', cursive;
    font-size: 22px;
    padding: 12px 28px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    transition: all 0.2s;
    -webkit-appearance: none;
    box-shadow: 0 5px 0 rgba(0,0,0,0.15);
  }

  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }

  .btn-check { background: linear-gradient(135deg, #42A5F5, #1565C0); color: white; }
  .btn-next  { background: linear-gradient(135deg, #66BB6A, #2E7D32); color: white; }
  .btn-hint  { background: linear-gradient(135deg, #FFA726, #E65100); color: white; }
  .btn-reset { background: linear-gradient(135deg, #AB47BC, #6A1B9A); color: white; }
  .btn-mode  { background: linear-gradient(135deg, #26C6DA, #00838F); color: white; }
  .btn-prev { background: linear-gradient(135deg, #90CAF9, #1565C0); color: white; }
  .btn-nextblank { background: linear-gradient(135deg, #FF8A65, #D84315); color: white; }

  /* 소단락 필터 버튼 */
  .subtopic-btn {
    font-family: 'Gaegu', cursive;
    font-size: 16px;
    padding: 7px 16px;
    background: white;
    border: 2px solid var(--sky);
    border-radius: 20px;
    color: var(--blue);
    cursor: pointer;
    -webkit-appearance: none;
    transition: all 0.2s;
  }
  .subtopic-btn.active {
    background: var(--blue);
    color: white;
    border-color: var(--deep);
    box-shadow: 0 3px 0 var(--deep);
  }

  /* 정답 후 다음 버튼 강조 */
  .btn-next-highlight {
    background: linear-gradient(135deg, #FFD600, #FF6F00) !important;
    animation: pulse 0.8s infinite alternate;
    font-size: 24px !important;
  }
  @keyframes pulse {
    from { transform: scale(1); box-shadow: 0 5px 0 rgba(0,0,0,0.15); }
    to   { transform: scale(1.07); box-shadow: 0 8px 16px rgba(255,111,0,0.4); }
  }

  /* ref-fill 빈칸 크기 */
  .ref-blank {
    border-bottom: 3px solid #1976D2;
    min-width: 90px;
  }

  /* 결과 메시지 */
  .result-msg {
    text-align: center;
    font-size: 28px;
    margin-top: 16px;
    font-family: 'Nanum Pen Script', cursive;
    padding: 12px;
    border-radius: 14px;
    display: none;
  }

  .result-msg.show { display: block; animation: bounce 0.4s ease; }

  @keyframes bounce {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  .result-msg.success { background: #C8E6C9; color: #1B5E20; }
  .result-msg.fail    { background: #FFCDD2; color: #B71C1C; }

  /* 전체 보기 모드 */
  .full-view .verse-text { font-size: 30px; }

  /* 모드 배지 */
  .mode-badge {
    text-align: center;
    margin-bottom: 14px;
  }

  .mode-badge span {
    font-size: 20px;
    background: var(--mint);
    border: 2px solid #00ACC1;
    border-radius: 20px;
    padding: 5px 18px;
    color: var(--deep);
  }

  /* 별 애니메이션 */
  .star-pop {
    position: fixed;
    font-size: 40px;
    pointer-events: none;
    z-index: 999;
    animation: starFly 1s ease forwards;
  }

  @keyframes starFly {
    from { opacity: 1; transform: translateY(0) scale(1); }
    to   { opacity: 0; transform: translateY(-120px) scale(1.8); }
  }

  /* 프로그레스 */
  .progress-bar {
    height: 14px;
    background: var(--light);
    border-radius: 10px;
    border: 2px solid var(--sky);
    margin-bottom: 16px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--sky), var(--blue));
    border-radius: 10px;
    transition: width 0.5s ease;
  }

  /* 완료 화면 */
  .finish-screen {
    text-align: center;
    padding: 30px;
    display: none;
  }

  .finish-screen.show { display: block; animation: popIn 0.5s ease; }

  .finish-screen h2 {
    font-family: 'Nanum Pen Script', cursive;
    font-size: 52px;
    color: var(--deep);
    margin-bottom: 10px;
  }

  .finish-screen .big-stars { font-size: 60px; }

  .finish-score {
    font-size: 30px;
    color: var(--blue);
    margin: 16px 0;
  }

  @media (max-width: 500px) {
    .header h1 { font-size: 38px; }
    .verse-text { font-size: 26px; }
    .blank-input { font-size: 24px; }
    .choice-btn { font-size: 22px; }
  }
</style>
</head>
<body>

<div class="container">

  <!-- 헤더 -->
  <div class="header">
    <h1>✝️ 성경암송 연습 🌟</h1>
    <div class="subtitle">사랑의교회 소년부 성경암송 골든벨</div>
    <div class="subtitle2">&lt; A-C 파트 &gt;</div>
    <span class="stars">⭐ ⭐ ⭐</span>
    <div style="margin-top:12px;">
      <button type="button" onclick="downloadApp()" style="font-family:'Gaegu',cursive;font-size:18px;padding:10px 24px;background:linear-gradient(135deg,#43A047,#1B5E20);color:white;border:none;border-radius:30px;cursor:pointer;box-shadow:0 4px 0 #1B5E20;-webkit-appearance:none;">
        💾 앱 저장하기 (HTML 다운로드)
      </button>
    </div>
  </div>

  <!-- 점수판 -->
  <div class="scoreboard">
    <div class="score-card">
      <div class="label">🎯 맞춘 수</div>
      <div class="value" id="score-correct">0</div>
    </div>
    <div class="score-card">
      <div class="label">📖 푼 구절</div>
      <div class="value" id="score-done">0</div>
    </div>
    <div class="score-card">
      <div class="label">🌟 별 점수</div>
      <div class="value" id="score-stars">0</div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button type="button" class="tab-btn active" onclick="selectGroup('A')">A. 새로운 삶</button>
    <button type="button" class="tab-btn" onclick="selectGroup('B')">B. 그리스도를 전파함</button>
    <button type="button" class="tab-btn" onclick="selectGroup('C')">C. 하나님을 의뢰함</button>
    <button type="button" class="tab-btn" onclick="startAllRandom()">🎲 전체 랜덤</button>
  </div>

  <!-- 구절 선택 -->
  <div class="verse-selector" id="verse-selector">
    <h2>📖 암송할 구절을 골라요!</h2>
    <div id="subtopic-btns" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;"></div>
    <div class="verse-grid" id="verse-grid"></div>
  </div>

  <!-- 모드 선택 배지 -->
  <div class="mode-badge" id="mode-badge" style="display:none">
    <span id="mode-label">✏️ 빈칸 채우기 모드</span>
    <button type="button" class="btn btn-mode" style="margin-left:10px;font-size:18px;padding:6px 16px;" onclick="toggleMode()">모드 변경</button>
  </div>

  <!-- 진행 바 -->
  <div class="progress-bar" id="progress-bar" style="display:none">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <!-- 메인 카드 -->
  <div class="main-card" id="main-card" style="display:none">
    <div class="card-header">
      <span class="topic-badge" id="topic-badge">주제</span>
      <span class="ref-badge" id="ref-badge">성경구절</span>
    </div>

    <div class="verse-text" id="verse-display"></div>

    <!-- 선택지 (객관식 모드) -->
    <div class="choices" id="choices-area"></div>

    <div class="result-msg" id="result-msg"></div>

    <div class="btn-row">
      <button type="button" class="btn btn-prev" id="btn-prev" onclick="prevVerse()">⬅️ 이전</button>
      <button type="button" class="btn btn-check" id="btn-check" onclick="checkAnswer()" style="display:none">✅ 확인!</button>
      <button type="button" class="btn btn-nextblank" id="btn-next-blank" onclick="moveFillFocus(currentFillBlankIdx+1)" style="display:none">다음칸 ➡️</button>
      <button type="button" class="btn btn-hint" onclick="showHint()">💡 힌트</button>
      <button type="button" class="btn btn-next" id="btn-next" onclick="nextVerse()">다음 ➡️</button>
      <button type="button" class="btn btn-reset" onclick="resetCard()">🔄 다시</button>
    </div>
  </div>

  <!-- 완료 화면 -->
  <div class="finish-screen" id="finish-screen">
    <div class="big-stars" id="finish-stars">🌟🌟🌟</div>
    <h2 id="finish-title">잘했어요! 🎉</h2>
    <div class="finish-score" id="finish-score"></div>
    <div id="finish-level-info" style="font-size:22px;color:var(--blue);margin:10px 0;"></div>
    <div style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:14px;">
      <button type="button" class="btn btn-next" id="btn-levelup" style="font-size:24px;padding:14px 36px;" onclick="levelUp()">🚀 다음 단계로!</button>
      <button type="button" class="btn btn-reset" style="font-size:20px;padding:12px 24px;" onclick="restartAll()">🔄 처음부터</button>
    </div>
  </div>

</div>

<script>
// ─── 데이터 ───────────────────────────────────────────────
var VERSES = [
  // A. 새로운 삶
  { group:'A', topic:'A-1. 중심되신 그리스도', ref:'고린도후서 5:17',
    text:'그런즉 누구든지 그리스도 안에 있으면 새로운 피조물이라 이전 것은 지나갔으니 보라 새 것이 되었도다' },
  { group:'A', topic:'A-1. 중심되신 그리스도', ref:'갈라디아서 2:20',
    text:'내가 그리스도와 함께 십자가에 못박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라 이제 내가 육체 가운데 사는 것은 나를 사랑하사 나를 위하여 자기 자신을 버리신 하나님의 아들을 믿는 믿음 안에서 사는 것이라' },
  { group:'A', topic:'A-2. 그리스도께 순종', ref:'로마서 12:1',
    text:'그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라' },
  { group:'A', topic:'A-2. 그리스도께 순종', ref:'요한복음 14:21',
    text:'나의 계명을 지키는 자라야 나를 사랑하는 자니 나를 사랑하는 자는 내 아버지께 사랑을 받을 것이요 나도 그를 사랑하여 그에게 나를 나타내리라' },
  { group:'A', topic:'A-3. 말씀', ref:'디모데후서 3:16',
    text:'모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니' },
  { group:'A', topic:'A-3. 말씀', ref:'여호수아 1:8',
    text:'이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라' },
  { group:'A', topic:'A-4. 기도', ref:'요한복음 15:7',
    text:'너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라 그리하면 이루리라' },
  { group:'A', topic:'A-4. 기도', ref:'빌립보서 4:6,7',

// ─── 상태 ────────────────────────────────────────────────
var currentGroup = 'A';
var currentMode = 'fill';
// 레벨 시스템: stage(1~4) × group(A→B→C)
var currentStage = 1; // 1=빈칸채우기, 2=선택지, 3=구절찾기, 4=전체암송(완전빈칸)

var stageGroupIdx = 0; // 현재 그룹 인덱스 // 'fill' | 'choice' | 'ref-fill' | 'view'

var queuedVerses = [];

var scoreDone = 0;
var scoreStars = 0;

// ─── 초기화 ───────────────────────────────────────────────
function init() {
  selectGroup('A');
}

function selectGroup(g) {
  currentGroup = g;
  document.querySelectorAll('.tab-btn').forEach(function(b,i) {
    var groups = ['A','B','C','ALL'];
    b.classList.toggle('active', groups[i] === g);
  });

  if (g === 'ALL') {
    filteredVerses = VERSES.slice();
  } else {
    filteredVerses = VERSES.filter(function(v){ return v.group === g; });
  }

  renderVerseGrid();
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('mode-badge').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('finish-screen').classList.remove('show');
  document.getElementById('verse-selector').style.display = 'block';
}

function renderVerseGrid() {
  var grid = document.getElementById('verse-grid');
  grid.innerHTML = '';

  // 소단락 필터 버튼 생성
  var subtopicArea = document.getElementById('subtopic-btns');
  subtopicArea.innerHTML = '';

  // 전체 버튼
  var allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'subtopic-btn active';
  allBtn.textContent = '전체';
  allBtn.onclick = function() { filterBySubtopic(null); };
  subtopicArea.appendChild(allBtn);

  // 소단락 목록 추출 (중복 제거)
  var topics = [];
  filteredVerses.forEach(function(v) {
    if (topics.indexOf(v.topic) === -1) topics.push(v.topic);
  });
  topics.forEach(function(topic) {
    var label = topic.split('. ').slice(1).join('. ');
    var tBtn = document.createElement('button');
    tBtn.type = 'button';
    tBtn.className = 'subtopic-btn';
    tBtn.textContent = topic.split('.')[0] + '. ' + label;
    tBtn.onclick = (function(t){ return function(){ filterBySubtopic(t); }; })(topic);
    subtopicArea.appendChild(tBtn);
  });

  renderVerseItems(filteredVerses);
}

function filterBySubtopic(topic) {
  // 버튼 활성화 표시
  document.querySelectorAll('.subtopic-btn').forEach(function(b) {
    b.classList.remove('active');
    if (topic === null && b.textContent === '전체') b.classList.add('active');
    else if (b.textContent.indexOf(topic ? topic.split('.')[0] : '') === 0 && topic !== null) b.classList.add('active');
  });
  var verses = topic ? filteredVerses.filter(function(v){ return v.topic === topic; }) : filteredVerses;
  renderVerseItems(verses);
}

function renderVerseItems(verses) {
  var grid = document.getElementById('verse-grid');
  grid.innerHTML = '';
  verses.forEach(function(v, i) {
    var globalIdx = filteredVerses.indexOf(v);
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'verse-item';
    btn.innerHTML = '<span class="ref">' + v.ref + '</span>' + v.topic.split('. ').slice(1).join('. ');
    btn.onclick = (function(idx){ return function(){ startWithVerse(idx); }; })(globalIdx);
    grid.appendChild(btn);
  });

  // 랜덤 버튼
  var randBtn = document.createElement('button');
  randBtn.type = 'button';
  randBtn.className = 'verse-item';
  randBtn.style.background = 'linear-gradient(135deg, #E3F2FD, #BBDEFB)';
  randBtn.style.borderColor = '#1976D2';
  randBtn.innerHTML = '🎲 랜덤으로 풀기!';
  randBtn.onclick = startRandom;
  grid.appendChild(randBtn);
}

function startWithVerse(idx) {
  // 선택한 구절의 소단락 파악
  var selectedVerse = filteredVerses[idx];
  var selectedTopic = selectedVerse.topic;

  // 전체 소단락 목록 (순서 유지)
  var allTopics = [];
  filteredVerses.forEach(function(v) {
    if (allTopics.indexOf(v.topic) === -1) allTopics.push(v.topic);
  });

  // 선택한 소단락부터 시작해서 순서대로 모든 구절 큐에 넣기
  var startTopicIdx = allTopics.indexOf(selectedTopic);
  var orderedTopics = allTopics.slice(startTopicIdx).concat(allTopics.slice(0, startTopicIdx));

  queuedVerses = [];
  orderedTopics.forEach(function(topic) {
    filteredVerses.forEach(function(v, i) {
      if (v.topic === topic) queuedVerses.push(i);
    });
  });

  currentVerseIdx = 0;
  showVerse();
}

function startAllRandom() {
  // 탭 활성화 표시
  document.querySelectorAll('.tab-btn').forEach(function(b,i) {
    b.classList.toggle('active', i === 3);
  });
  currentGroup = 'ALL';
  filteredVerses = VERSES.slice();
  // 구절 선택 화면 없이 바로 전체 랜덤 시작
  queuedVerses = shuffle(filteredVerses.map(function(_,i){ return i; }));
  currentVerseIdx = 0;
  showVerse();
}

function startRandom() {
  queuedVerses = shuffle(filteredVerses.map(function(_,i){ return i; }));
  currentVerseIdx = 0;
  showVerse();
}

function shuffle(arr) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function showVerse() {
  document.getElementById('verse-selector').style.display = 'none';
  document.getElementById('finish-screen').classList.remove('show');
  document.getElementById('mode-badge').style.display = 'block';
  document.getElementById('progress-bar').style.display = 'block';
  document.getElementById('main-card').style.display = 'block';

  updateModeLabel();
  renderCurrentVerse();
  updateProgress();
}

function updateModeLabel() {
  var labels = {
    fill:     '✏️ 빈칸 채우기 모드',
    choice:   '🎯 선택지 고르기 모드',
    'ref-fill':'📖 구절 찾기 모드',
    view:     '👀 전체 보기 모드'
  };
  var stageLabel = currentStage > 0 ? ' [' + currentStage + '단계 / ' + currentGroup + '파트]' : '';
  document.getElementById('mode-label').textContent = (labels[currentMode] || currentMode) + stageLabel;
}

function toggleMode() {
  var modes = ['fill','choice','ref-fill','view'];
  var idx = modes.indexOf(currentMode);
  currentMode = modes[(idx+1) % modes.length];
  updateModeLabel();
  renderCurrentVerse();
}

function renderCurrentVerse() {
  if (currentVerseIdx >= queuedVerses.length) {
    showFinish();
    return;
  }

  var verseObj = filteredVerses[queuedVerses[currentVerseIdx]];
  answered = false;
  blanks = [];
  blankAnswers = [];
  currentChoiceTarget = 0;

  document.getElementById('topic-badge').textContent = verseObj.topic;
  // ref-fill 모드에서는 구절 참조가 정답이므로 숨김
  if (currentMode === 'ref-fill') {
    document.getElementById('ref-badge').textContent = '? ? ?';
    document.getElementById('ref-badge').style.color = '#BDBDBD';
  } else {
    document.getElementById('ref-badge').textContent = verseObj.ref;
    document.getElementById('ref-badge').style.color = '';
  }
  document.getElementById('result-msg').className = 'result-msg';
  document.getElementById('result-msg').textContent = '';
  document.getElementById('choices-area').innerHTML = '';
  document.getElementById('btn-next-blank').style.display = 'none';
  currentFillBlankIdx = 0;

  var checkBtn = document.getElementById('btn-check');

  if (currentMode === 'view') {
    document.getElementById('verse-display').innerHTML = '<span style="color:#1976D2">' + verseObj.text + '</span>';
    checkBtn.style.display = 'none';
  } else if (currentMode === 'fill') {
    renderFillBlanks(verseObj);
    checkBtn.style.display = 'inline-block';
  } else if (currentMode === 'choice') {
    renderChoiceMode(verseObj);
    checkBtn.style.display = 'none';
  } else if (currentMode === 'ref-fill') {
    renderRefFill(verseObj);
    checkBtn.style.display = 'inline-block';
  }
}

// ─── 빈칸 채우기 ──────────────────────────────────────────
function renderFillBlanks(verseObj) {
  var words = verseObj.text.split(' ');
  var blankIndices = [];
  var step = Math.max(2, Math.floor(words.length / Math.max(2, Math.floor(words.length * 0.35))));
  for (var i = 1; i < words.length; i += step) {
    if (words[i].length >= 2) blankIndices.push(i);
    if (blankIndices.length >= 6) break;
  }
  if (blankIndices.length < 2) blankIndices = [1, Math.floor(words.length/2)];

  blankAnswers = blankIndices.map(function(i){ return words[i]; });
  currentFillBlankIdx = 0;

  var html = '';
  words.forEach(function(w, i) {
    if (blankIndices.indexOf(i) !== -1) {
      var bIdx = blankIndices.indexOf(i);
      var width = Math.max(70, w.length * 22) + 'px';
      html += '<span class="blank" id="blank-'+bIdx+'">'
            + '<input class="blank-input" id="blank-input-'+bIdx+'" type="text" style="width:'+width+'" placeholder="___" />'
            + '</span> ';
      blanks.push(bIdx);
    } else {
      html += w + ' ';
    }
  });

  document.getElementById('verse-display').innerHTML = html;

  // 다음칸 버튼 표시
  document.getElementById('btn-next-blank').style.display = 'inline-block';

  // 각 input에 엔터키 → 다음 빈칸 이동 연결
  blankAnswers.forEach(function(ans, i) {
    var inp = document.getElementById('blank-input-'+i);
    if (!inp) return;
    inp.onkeydown = function(e) {
      var key = e.keyCode || e.which;
      if (key === 13) { e.preventDefault(); moveFillFocus(i + 1); }
    };
    inp.onfocus = function() { currentFillBlankIdx = i; updateFillFocusStyle(); };
  });

  // 첫 번째 칸 포커스
  setTimeout(function(){
    var first = document.getElementById('blank-input-0');
    if (first) { first.focus(); updateFillFocusStyle(); }
  }, 100);
}

function moveFillFocus(nextIdx) {
  if (nextIdx >= blankAnswers.length) {
    // 마지막 칸 → 확인 버튼으로 이동
    document.getElementById('btn-check').focus();
  } else {
    currentFillBlankIdx = nextIdx;
    var inp = document.getElementById('blank-input-'+nextIdx);
    if (inp) { inp.focus(); updateFillFocusStyle(); }
  }
}

function updateFillFocusStyle() {
  blankAnswers.forEach(function(ans, i) {
    var el = document.getElementById('blank-'+i);
    if (!el) return;
    if (el.classList.contains('correct') || el.classList.contains('wrong')) return;
    el.style.borderColor = (i === currentFillBlankIdx) ? '#FF6F00' : '';
    el.style.borderWidth = (i === currentFillBlankIdx) ? '3px' : '';
  });
}

// ─── 구절 찾기 모드 (ref-fill) ────────────────────────────
function renderRefFill(verseObj) {
  // 본문은 전부 보여주고, 구절(참조)을 빈칸으로
  document.getElementById('verse-display').innerHTML =
    '<span style="color:#1A237E">' + verseObj.text + '</span>'
    + '<div style="margin-top:18px;padding-top:14px;border-top:2px dashed #90CAF9;">'
    + '<span style="font-size:22px;color:#1976D2;">📌 이 말씀의 성경 구절은?</span><br>'
    + '<div style="margin-top:10px;display:flex;align-items:center;flex-wrap:wrap;gap:8px;">'
    + buildRefBlanks(verseObj.ref)
    + '</div></div>';

  // 다음칸 버튼 표시
  document.getElementById('btn-next-blank').style.display = 'inline-block';

  // 엔터 이동 연결
  blankAnswers.forEach(function(ans, i) {
    var inp = document.getElementById('blank-input-'+i);
    if (!inp) return;
    inp.onkeydown = function(e) {
      var key = e.keyCode || e.which;
      if (key === 13) { e.preventDefault(); moveFillFocus(i + 1); }
    };
    inp.onfocus = function() { currentFillBlankIdx = i; updateFillFocusStyle(); };
  });

  setTimeout(function(){
    var first = document.getElementById('blank-input-0');
    if (first) { first.focus(); updateFillFocusStyle(); }
  }, 100);
}

function buildRefBlanks(ref) {
  // ref를 ' ' 기준으로 쪼개서 각 파트를 빈칸으로
  // 예: "로마서 3:23" → ["로마서", "3:23"]
  // 예: "빌립보서 4:6-7" → ["빌립보서", "4:6-7"]
  var parts = ref.split(' ');
  blankAnswers = parts;
  currentFillBlankIdx = 0;
  blanks = parts.map(function(_, i){ return i; });

  var html = '';
  parts.forEach(function(p, i) {
    var width = Math.max(80, p.length * 26) + 'px';
    html += '<span class="blank ref-blank" id="blank-'+i+'">'
          + '<input class="blank-input" id="blank-input-'+i+'" type="text" style="width:'+width+';font-size:26px;" placeholder="___" />'
          + '</span>';
    if (i < parts.length - 1) html += ' ';
  });
  return html;
}

// ─── 선택지 모드 ──────────────────────────────────────────
function renderChoiceMode(verseObj) {
  var words = verseObj.text.split(' ');
  var blankIndices = [];
  var step = Math.max(2, Math.floor(words.length / Math.max(2, Math.floor(words.length * 0.35))));
  for (var i = 1; i < words.length; i += step) {
    if (words[i].length >= 2) blankIndices.push(i);
    if (blankIndices.length >= 5) break;
  }
  if (blankIndices.length < 2) blankIndices = [1, Math.floor(words.length/2)];

  blankAnswers = blankIndices.map(function(i){ return words[i]; });

  var html = '';
  words.forEach(function(w, i) {
    if (blankIndices.indexOf(i) !== -1) {
      var bIdx = blankIndices.indexOf(i);
      var width = Math.max(60, w.length * 22) + 'px';
      html += '<span class="blank" id="blank-'+bIdx+'"><span class="blank-input" id="blank-input-'+bIdx+'" style="display:inline-block;min-width:'+width+';color:#1976D2"> ? </span></span> ';
    } else {
      html += w + ' ';
    }
  });
  document.getElementById('verse-display').innerHTML = html;

  // 선택지 생성
  var correctWords = blankAnswers.slice();
  var wrongPool = getWrongWords(verseObj, correctWords);
  var choiceWords = correctWords.concat(wrongPool.slice(0, Math.max(2, 6 - correctWords.length)));
  choiceWords = shuffle(choiceWords);

  var choicesArea = document.getElementById('choices-area');
  choicesArea.innerHTML = '';
  choiceWords.forEach(function(w) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'choice-btn';
    btn.textContent = w;
    btn.onclick = (function(word, el){ return function(){ selectChoice(word, el); }; })(w, btn);
    choicesArea.appendChild(btn);
  });

  currentChoiceTarget = 0;
  highlightCurrentBlank();
}

function getWrongWords(verseObj, correctWords) {
  var pool = [];
  VERSES.forEach(function(v) {
    v.text.split(' ').forEach(function(w) {
      if (w.length >= 2 && correctWords.indexOf(w) === -1 && pool.indexOf(w) === -1) pool.push(w);
    });
  });
  return shuffle(pool);
}

function highlightCurrentBlank() {
  for (var i = 0; i < blankAnswers.length; i++) {
    var el = document.getElementById('blank-'+i);
    if (!el) continue;
    el.style.borderColor = (i === currentChoiceTarget) ? '#FF6F00' : '';
  }
}

function selectChoice(word, btn) {
  if (answered) return;
  if (currentChoiceTarget >= blankAnswers.length) return;

  var targetEl = document.getElementById('blank-input-'+currentChoiceTarget);
  var blankEl = document.getElementById('blank-'+currentChoiceTarget);
  var correct = blankAnswers[currentChoiceTarget];

  targetEl.textContent = word;

  if (word === correct) {
    blankEl.className = 'blank correct';
    btn.classList.add('correct-choice');
    showStarPop(btn);
  } else {
    blankEl.className = 'blank wrong';
    btn.classList.add('wrong-choice');
    // 정답 보여주기
    targetEl.textContent = correct + ' ✓';
    blankEl.className = 'blank correct';
    setTimeout(function(){ btn.classList.remove('wrong-choice'); }, 800);
  }

  btn.classList.add('used');
  currentChoiceTarget++;

  if (currentChoiceTarget >= blankAnswers.length) {
    // 모두 채움
    setTimeout(function(){
      answered = true;
      var allCorrect = true;
      // 체크
      blankAnswers.forEach(function(ans, i) {
        var el = document.getElementById('blank-input-'+i);
        var val = el ? el.textContent.replace(' ✓','').trim() : '';
        if (val !== ans) allCorrect = false;
      });
      showResult(allCorrect);
    }, 400);
  } else {
    highlightCurrentBlank();
  }
}

// ─── 정답 확인 ────────────────────────────────────────────
function checkAnswer() {
  if (answered) return;
  answered = true;

  var correctCount = 0;
  blankAnswers.forEach(function(ans, i) {
    var inputEl = document.getElementById('blank-input-'+i);
    var blankEl = document.getElementById('blank-'+i);
    if (!inputEl || !blankEl) return;
    var val = inputEl.value.trim();
    if (val === ans) {
      blankEl.classList.add('correct');
      correctCount++;
    } else {
      blankEl.classList.add('wrong');
      inputEl.value = ans; // 정답 보여주기
    }
  });

  // ref-fill 모드이면 정답 공개
  if (currentMode === 'ref-fill') {
    var verseObj = filteredVerses[queuedVerses[currentVerseIdx]];
    document.getElementById('ref-badge').textContent = verseObj.ref;
    document.getElementById('ref-badge').style.color = '';
  }

  // 80% 이상이면 통과
  var ratio = blankAnswers.length > 0 ? correctCount / blankAnswers.length : 1;
  var passed = (ratio >= 0.8);
  showResult(passed, correctCount, blankAnswers.length);
}

function showResult(ok, correctCount, totalCount) {
  var msg = document.getElementById('result-msg');
  scoreDone++;

  // correctCount/totalCount가 없으면 blankAnswers에서 직접 계산
  if (correctCount === undefined) {
    correctCount = 0;
    totalCount = blankAnswers.length;
    blankAnswers.forEach(function(ans, i) {
      var inputEl = document.getElementById('blank-input-'+i);
      if (!inputEl) return;
      var val = (inputEl.value !== undefined ? inputEl.value : inputEl.textContent).trim().replace(' ✓','');
      if (val === ans) correctCount++;
    });
  }
  var pct = totalCount > 0 ? Math.round(correctCount / totalCount * 100) : (ok ? 100 : 0);
  var passed = ok || (pct >= 80);

  if (passed) {
    scoreCorrect++;
    scoreStars += (pct === 100 ? 3 : 2);
    if (pct === 100) {
      msg.textContent = '🌟 완벽해요! 정말 잘했어요! 🎉';
    } else {
      msg.textContent = '👍 ' + pct + '% 통과! 정답 확인하고 다음으로 넘어가요 😊';
    }
    msg.className = 'result-msg success show';
    showStarPopCenter();
    var nextBtn = document.getElementById('btn-next');
    nextBtn.classList.add('btn-next-highlight');
    nextBtn.textContent = '다음 구절 ➡️';
    // 3초 후 소단락 순서로 자동 이동
    setTimeout(function() {
      if (answered) nextVerseInOrder();
    }, 3000);
  } else {
    msg.textContent = '💪 ' + pct + '% - 80% 이상이면 통과예요! 다시 도전해봐요!';
    msg.className = 'result-msg fail show';
  }

  updateScores();
}

// 소단락 순서대로 다음 구절 이동 (A-1 두 구절 → A-2 → ...)
function nextVerseInOrder() {
  var nextBtn = document.getElementById('btn-next');
  if (nextBtn) { nextBtn.classList.remove('btn-next-highlight'); nextBtn.textContent = '다음 ➡️'; }

  var curGlobalIdx = queuedVerses[currentVerseIdx];
  var curVerse = filteredVerses[curGlobalIdx];
  var curTopic = curVerse ? curVerse.topic : '';

  // 전체 소단락 목록
  var topics = [];
  filteredVerses.forEach(function(v) { if (topics.indexOf(v.topic) === -1) topics.push(v.topic); });

  // 같은 소단락 내 다른 구절
  var sameTopicOther = [];
  filteredVerses.forEach(function(v, i) {
    if (v.topic === curTopic && i !== curGlobalIdx) sameTopicOther.push(i);
  });

  var nextIdx;
  if (sameTopicOther.length > 0) {
    // 같은 소단락의 다른 구절로
    nextIdx = sameTopicOther[0];
  } else {
    // 다음 소단락 첫 구절로
    var curTopicIdx = topics.indexOf(curTopic);
    var nextTopicIdx = (curTopicIdx + 1) % topics.length;
    var nextTopic = topics[nextTopicIdx];
    filteredVerses.forEach(function(v, i) {
      if (v.topic === nextTopic && nextIdx === undefined) nextIdx = i;
    });
  }

  // 한 바퀴 다 돌았는지 체크 (다음 소단락이 처음 소단락이면 파트 완료)
  var curTopicIdx2 = topics.indexOf(curTopic);
  var wrappedAround = (sameTopicOther.length === 0 && curTopicIdx2 === topics.length - 1);
  if (wrappedAround) {
    // 파트(그룹) 완료 → showFinish
    showFinish();
    return;
  }

  if (nextIdx === undefined) nextIdx = 0;
  queuedVerses = [nextIdx];
  currentVerseIdx = 0;
  answered = false;
  renderCurrentVerse();
  updateProgress();
}

function updateScores() {
  document.getElementById('score-correct').textContent = scoreCorrect;
  document.getElementById('score-done').textContent = scoreDone;
  document.getElementById('score-stars').textContent = scoreStars;
}

// ─── 힌트 ─────────────────────────────────────────────────
function showHint() {
  if (currentMode === 'fill' || currentMode === 'ref-fill') {
    blankAnswers.forEach(function(ans, i) {
      var inputEl = document.getElementById('blank-input-'+i);
      if (inputEl && (!inputEl.value || inputEl.value.trim() === '')) {
        inputEl.value = ans[0] + '...';
        inputEl.style.color = '#FF6F00';
      }
    });
  } else if (currentMode === 'choice') {
    // 현재 빈칸의 정답 강조
    var ans = blankAnswers[currentChoiceTarget];
    document.querySelectorAll('.choice-btn').forEach(function(btn) {
      if (btn.textContent === ans) {
        btn.style.background = '#FFF9C4';
        btn.style.borderColor = '#F9A825';
      }
    });
  }
}

// ─── 다음 구절 ────────────────────────────────────────────
function prevVerse() {
  var nextBtn = document.getElementById('btn-next');
  if (nextBtn) { nextBtn.classList.remove('btn-next-highlight'); nextBtn.textContent = '다음 ➡️'; }

  if (queuedVerses.length > 1) {
    // 랜덤 큐 모드
    if (currentVerseIdx > 0) {
      currentVerseIdx--;
      answered = false;
      renderCurrentVerse();
      updateProgress();
    }
  } else {
    // 소단락 순서 이전 구절
    var curGlobalIdx = queuedVerses[currentVerseIdx];
    var curVerse = filteredVerses[curGlobalIdx];
    var curTopic = curVerse ? curVerse.topic : '';

    // 전체 소단락 목록
    var topics = [];
    filteredVerses.forEach(function(v) { if (topics.indexOf(v.topic) === -1) topics.push(v.topic); });
    var curTopicIdx = topics.indexOf(curTopic);

    // 같은 소단락 내 다른 구절
    var sameTopicOther = [];
    filteredVerses.forEach(function(v, i) {
      if (v.topic === curTopic && i !== curGlobalIdx) sameTopicOther.push(i);
    });

    var prevIdx;
    if (sameTopicOther.length > 0) {
      prevIdx = sameTopicOther[0];
    } else if (curTopicIdx > 0) {
      // 이전 소단락 마지막 구절
      var prevTopic = topics[curTopicIdx - 1];
      filteredVerses.forEach(function(v, i) {
        if (v.topic === prevTopic) prevIdx = i;
      });
    } else {
      // 이미 첫 구절
      return;
    }

    if (prevIdx === undefined) return;
    queuedVerses = [prevIdx];
    currentVerseIdx = 0;
    answered = false;
    renderCurrentVerse();
    updateProgress();
  }
}

function nextVerse() {
  var nextBtn = document.getElementById('btn-next');
  if (nextBtn) { nextBtn.classList.remove('btn-next-highlight'); nextBtn.textContent = '다음 ➡️'; }

  if (queuedVerses.length > 1) {
    var prevTopic = filteredVerses[queuedVerses[currentVerseIdx]].topic;
    currentVerseIdx++;
    if (currentVerseIdx >= queuedVerses.length) {
      showFinish();
      return;
    }
    var nextTopic = filteredVerses[queuedVerses[currentVerseIdx]].topic;
    // 소단락이 바뀌면 잠깐 안내
    if (prevTopic !== nextTopic) {
      var card = document.getElementById('main-card');
      var notice = document.createElement('div');
      notice.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0D47A1;color:white;font-family:Nanum Pen Script,cursive;font-size:32px;padding:24px 40px;border-radius:24px;z-index:999;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.3);';
      notice.innerHTML = '📖 다음 단락으로!<br><span style="font-size:24px;">' + nextTopic + '</span>';
      document.body.appendChild(notice);
      setTimeout(function(){ notice.remove(); }, 1800);
    }
  }

  answered = false;
  renderCurrentVerse();
}

function resetCard() {
  answered = false;
  renderCurrentVerse();
}

function updateProgress() {
  if (queuedVerses.length <= 1) {
    document.getElementById('progress-fill').style.width = '100%';
    return;
  }
  var pct = Math.round((currentVerseIdx / queuedVerses.length) * 100);
  document.getElementById('progress-fill').style.width = pct + '%';
}

// ─── 레벨/단계 정보 ──────────────────────────────────────
var STAGE_NAMES = {
  1: '✏️ 1단계: 빈칸 채우기',
  2: '🎯 2단계: 선택지 고르기',
  3: '📖 3단계: 구절 찾기',
  4: '🏆 4단계: 완전 암송!'
};
var STAGE_MODES = { 1:'fill', 2:'choice', 3:'ref-fill', 4:'full-blank' };

// ─── 완료 화면 ────────────────────────────────────────────
function showFinish() {
  document.getElementById('main-card').style.display = 'none';
  document.getElementById('mode-badge').style.display = 'none';
  document.getElementById('progress-bar').style.display = 'none';
  document.getElementById('finish-screen').classList.add('show');
  document.getElementById('finish-score').textContent =
    '맞춘 구절: ' + scoreCorrect + ' / ' + scoreDone + '  |  별 점수: ' + scoreStars + '⭐';

  // 다음 단계 정보 표시
  var nextGroup = stageGroups[stageGroupIdx + 1];
  var nextStage = currentStage + 1;
  var levelInfo = '';
  var btnText = '🚀 다음 단계로!';
  var stars = '🌟🌟🌟';
  var title = '';

  if (stageGroupIdx < stageGroups.length - 1) {
    // 같은 단계, 다음 그룹
    levelInfo = '지금: ' + STAGE_NAMES[currentStage] + ' / ' + stageGroups[stageGroupIdx] + ' 파트 완료! → 다음: ' + stageGroups[stageGroupIdx+1] + ' 파트로!';
    btnText = '➡️ ' + stageGroups[stageGroupIdx+1] + ' 파트로!';
    title = stageGroups[stageGroupIdx] + ' 파트 완료! 🎉';
    stars = '⭐⭐⭐';
  } else if (currentStage < 4) {
    // 다음 단계로
    levelInfo = stageGroups[stageGroupIdx] + ' 파트까지 완료! → 더 어려운 ' + STAGE_NAMES[nextStage] + ' 시작!';
    btnText = '🚀 ' + STAGE_NAMES[nextStage] + ' 시작!';
    title = '단계 완료! 레벨업! 🎊';
    stars = '🌟🌟🌟';
  } else {
    // 모든 단계 완료!
    levelInfo = '모든 단계를 완료했어요! 진짜 골든벨 도전자!';
    btnText = '🏆 처음부터 다시!';
    title = '🏆 골든벨 완전 정복! 🏆';
    stars = '🏆🌟🏆';
    document.getElementById('btn-levelup').onclick = function(){ restartAll(); };
  }

  document.getElementById('finish-stars').textContent = stars;
  document.getElementById('finish-title').textContent = title || '파트 완료!';
  document.getElementById('finish-level-info').textContent = levelInfo;
  document.getElementById('btn-levelup').textContent = btnText;
}

function levelUp() {
  document.getElementById('finish-screen').classList.remove('show');

  if (stageGroupIdx < stageGroups.length - 1) {
    // 같은 단계, 다음 그룹
    stageGroupIdx++;
    currentGroup = stageGroups[stageGroupIdx];
    currentMode = STAGE_MODES[currentStage];
  } else if (currentStage < 4) {
    // 다음 단계, A 그룹부터
    currentStage++;
    stageGroupIdx = 0;
    currentGroup = 'A';
    currentMode = STAGE_MODES[currentStage];
    // 4단계는 full-blank가 없으니 fill로
    if (currentMode === 'full-blank') currentMode = 'fill';
  } else {
    restartAll();
    return;
  }

  updateModeLabel();
  filteredVerses = VERSES.filter(function(v){ return v.group === currentGroup; });

  // 탭 활성화
  document.querySelectorAll('.tab-btn').forEach(function(b,i) {
    var groups = ['A','B','C','ALL'];
    b.classList.toggle('active', groups[i] === currentGroup);
  });

  // 해당 그룹 전체 구절을 순서대로 큐에 넣기
  queuedVerses = filteredVerses.map(function(_,i){ return i; });
  currentVerseIdx = 0;
  answered = false;
  showVerse();
}

function restartAll() {
  scoreCorrect = 0; scoreDone = 0; scoreStars = 0;
  currentStage = 1;
  stageGroupIdx = 0;
  currentGroup = 'A';
  currentMode = 'fill';
  updateScores();
  document.getElementById('finish-screen').classList.remove('show');
  selectGroup('A');
}

// ─── 별 팝 애니메이션 ─────────────────────────────────────
function showStarPop(refEl) {
  var rect = refEl ? refEl.getBoundingClientRect() : { left: window.innerWidth/2, top: window.innerHeight/2 };
  var stars = ['⭐','🌟','✨'];
  for (var k = 0; k < 3; k++) {
    (function(kk){ setTimeout(function(){
      var el = document.createElement('div');
      el.className = 'star-pop';
      el.textContent = stars[kk % stars.length];
      el.style.left = (rect.left + Math.random() * 60 - 20) + 'px';
      el.style.top  = (rect.top  + Math.random() * 20) + 'px';
      document.body.appendChild(el);
      setTimeout(function(){ el.remove(); }, 1000);
    }, kk * 150); })(k);
  }
}

function showStarPopCenter() {
  var fakeEl = { getBoundingClientRect: function(){ return { left: window.innerWidth/2 - 40, top: window.innerHeight/2 }; }};
  showStarPop(fakeEl.getBoundingClientRect ? fakeEl : null);
}

// ─── 다운로드 ─────────────────────────────────────────────
function downloadApp() {
  var html = document.documentElement.outerHTML;
  var blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'index.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─── 시작 ─────────────────────────────────────────────────
init();
</script>
